<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gramudyog Margdarshak – Scheme Guide for Rural Entrepreneurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--ink:#0b2545;--mute:#4a5f7a;--green:#1565c0;--gold:#90caf9;--tint:#eaf3fe;--line:#c9dcf3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px}
h1,h2,h3{font-family:"Baloo 2","Noto Sans Devanagari",sans-serif;line-height:1.2;margin:0 0 .5rem}
a{color:var(--green)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;flex-wrap:wrap}
.logo{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.2rem}
nav a{margin-right:14px;text-decoration:none;color:var(--ink);font-weight:600}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer}
.lang button:first-child{border-radius:20px 0 0 20px}.lang button:last-child{border-radius:0 20px 20px 0}
.lang button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.hero{padding:44px 0 34px;background:var(--tint);border-bottom:4px solid var(--gold)}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;max-width:16ch}
.hero p{max-width:56ch;color:var(--mute);font-size:1.1rem}
.btn{display:inline-block;background:var(--green);color:#fff;padding:11px 22px;border-radius:8px;text-decoration:none;font-weight:600;border:0;font-size:1rem;cursor:pointer}
.btn.alt{background:var(--gold);color:#0b2545;margin-left:8px}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px}
.stats b{font-family:"Baloo 2",sans-serif;font-size:1.7rem;display:block}
.stats span{color:var(--mute);font-size:.95rem}
section{padding:42px 0}
h2{font-size:1.8rem}
.sub{color:var(--mute);margin-bottom:18px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input[type=search]{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:18px}
.card h3{font-size:1.2rem}
.tag{display:inline-block;background:var(--tint);color:var(--green);font-size:.82rem;padding:2px 10px;border-radius:12px;margin-bottom:8px;font-weight:600}
.card .big{font-weight:600;margin:.4rem 0}
.card details summary{cursor:pointer;font-weight:600;color:var(--green);margin-top:8px}
.card ul{padding-left:18px;margin:6px 0}
.steps{counter-reset:s;display:grid;gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 16px 16px 66px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0b2545;font:800 1.2rem "Baloo 2",sans-serif;display:grid;place-items:center}
.docs{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.docs label{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:8px;cursor:pointer}
.docs input{width:20px;height:20px;accent-color:var(--green)}
#prog{font-weight:600;color:var(--green);margin-bottom:10px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:10px}
.faq summary{font-weight:600;cursor:pointer}
.help{background:var(--ink);color:var(--bg)}
.help a{color:var(--gold);font-weight:600}
footer{padding:24px 0;color:var(--mute);font-size:.9rem;text-align:center}
.empty{padding:20px;color:var(--mute)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<header><div class="wrap bar">
 <div class="logo">💼 Gramudyog Margdarshak</div>

<section id="steps" style="background:var(--tint)"><div class="wrap">

</div></section>

<section id="docs"><div class="wrap">

</div></section>

<section class="help" id="help"><div class="wrap">

</div></section>

<footer><div class="wrap" id="foot"></div></footer>

let L=localStorage.getItem("lang")||"en",C="all",done={};
try{done=JSON.parse(localStorage.getItem("docs")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
function render(){
 const t=T[L];document.documentElement.lang=L;
 $("nav").innerHTML=["schemes","steps","docs","faq","help"].map((k,i)=>`<a href="#${k}">${t.nav[i]}</a>`).join("");
 ["h1","b1","b2","t1","s1","t2","s2","t3","s3","t4","t5"].forEach(k=>$(k).textContent=t[k]);
 $("hp").textContent=t.hp;$("hl").innerHTML=t.hl;$("foot").textContent=t.foot;$("q").placeholder=t.q;
 $("stats").innerHTML=t.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
 $("chips").innerHTML=Object.entries(t.cats).map(([k,v])=>`<button class="chip" data-c="${k}" aria-pressed="${k==C}">${v}</button>`).join(" ");
 $("stepList").innerHTML=t.steps.map(s=>`<div class="step"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
 $("faqList").innerHTML=t.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("");
 $("docList").innerHTML=t.docs.map((d,i)=>`<li><label><input type="checkbox" data-d="${i}" ${done[i]?"checked":""}>${d}</label></li>`).join("");
 prog();grid();
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==L));
}
function grid(){
 const t=T[L],q=$("q").value.trim().toLowerCase();
 const r=S.filter(s=>(C=="all"||s.c.includes(C))&&(!q||(s.n[L]+s.b[L]+s.w[L]).toLowerCase().includes(q)));
 $("grid").innerHTML=r.length?r.map(s=>`<article class="card">${s.c.map(c=>`<span class="tag">${t.cats[c]}</span> `).join("")}<h3>${s.n[L]}</h3><p class="big">${t.benefit}: ${s.b[L]}</p><details><summary>${t.det}</summary><p><b>${t.who}:</b> ${s.w[L]}</p><p><b>${t.how}:</b> ${s.h[L]}</p><a class="btn" href="${s.l}" target="_blank" rel="noopener">${t.site}</a></details></article>`).join(""):`<p class="empty">${t.none}</p>`;
}
function prog(){const n=T[L].docs.length,a=Object.values(done).filter(Boolean).length;$("prog").textContent=T[L].prog(a,n)}
document.addEventListener("click",e=>{
 const l=e.target.closest("[data-l]");if(l){L=l.dataset.l;try{localStorage.setItem("lang",L)}catch(x){}render()}
 const c=e.target.closest("[data-c]");if(c){C=c.dataset.c;render()}
});
document.addEventListener("change",e=>{
 if(e.target.dataset.d!==undefined){done[e.target.dataset.d]=e.target.checked;try{localStorage.setItem("docs",JSON.stringify(done))}catch(x){}prog()}
});
$("q").addEventListener("input",grid);
render();
</script>
</body>
</html>
